<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>检查更新 · EasyNote</title>
</head>
<body>
  <main class="popup">
    <h1>检查更新</h1>
    <p id="status" role="status" aria-live="polite">正在连接 GitHub…</p>
    <p id="versions" class="versions"></p>
    <div class="buttons">
      <button id="retry" type="button">重新检查</button>
      <button id="release" type="button" class="primary" hidden>打开发布页</button>
      <button id="close" type="button">关闭</button>
    </div>
  </main>
  <script type="module" src="/src/update.ts"></script>
</body>
</html>
